<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Error {{ code }}</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:var(--meil-bg);">
<div class="text-center">
  <h1 class="display-3 fw-bold text-meil">{{ code }}</h1>
  <p class="lead text-muted">{{ message }}</p>
  <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-meil-primary">Return Home</a>
</div>
</body>
</html>
